function migrarLedger() {
  const propios = S.cultivos.filter(c => !c.ejemplo);
  const l = { dias: {}, creados: propios.length };
  const dia = d => l.dias[d] || (l.dias[d] = { r: 0, m: 0 });
  propios.forEach(c => {
    c.bitacora.forEach(r => { const x = dia(r.fecha.slice(0, 10)); if (x.r < TOPE_REG_DIA) x.r++; });
    c.condiciones.forEach(r => { const x = dia(r.fecha.slice(0, 10)); if (x.m < TOPE_MED_DIA) x.m++; });
  });
  return l;
}

const p2 = n => String(n).padStart(2, '0');

function evaluarPPFD(etapa, v) {
  const r = PPFD[etapa]; if (!r || v == null) return null;
  if (v < r[0]) return { ok: false, m: `Poca luz para ${etapa.toLowerCase()} (recomendado ${r[0]}–${r[1]}). Acercá la lámpara o subí la potencia.` };
  if (v > r[1]) return { ok: false, m: `Demasiada luz para ${etapa.toLowerCase()} (recomendado ${r[0]}–${r[1]}). Alejá la lámpara para evitar estrés lumínico.` };
  return { ok: true, m: `Intensidad dentro del rango recomendado (${r[0]}–${r[1]}).` };
}
function evaluarAltura(a) {
  if (a == null) return null;
  return a < 20 ? { ok: false, m: 'La lámpara está muy cerca (menos de 20 cm). Riesgo de quemaduras.' } : { ok: true, m: 'Altura razonable. Confirmá la recomendación del fabricante.' };
}
function vpd(t, h) {
  if (t == null || h == null) return null;
  return +(0.61078 * Math.exp(17.27 * t / (t + 237.3)) * (1 - h / 100)).toFixed(2);
}
function saludCultivo(c) {
  const u = c.condiciones[0];
  if (u && c.ubicacion === 'interior') {
    const pp = evaluarPPFD(c.etapa, u.ppfd); const al = evaluarAltura(u.alturaCm);
    if ((pp && !pp.ok) || (al && !al.ok)) return { nivel: 'alerta', texto: 'Revisá la luz: hay una medición fuera de rango' };
  }
  if (c.bitacora.length === 0) return { nivel: 'aviso', texto: 'Sin registros todavía' };
  const d = diasDesde(c.bitacora[0].fecha);
  if (d >= 3) return { nivel: 'aviso', texto: `Sin registros hace ${d} días` };
  return { nivel: 'ok', texto: 'Todo en orden por ahora' };
}
function diasActivos() {
  const set = new Set();
  Object.keys(tareasPorDia).forEach(k => { if (tareasPorDia[k].length) set.add(k); });
  Object.keys(estudio).forEach(k => { if (estudio[k]) set.add(k); });
  Object.keys(ledger.dias).forEach(k => { const d = ledger.dias[k]; if ((d.r || 0) + (d.m || 0) > 0) set.add(k); });
  S.cultivos.filter(c => !c.ejemplo).forEach(c => {
    c.bitacora.forEach(r => set.add(r.fecha.slice(0, 10)));
    c.condiciones.forEach(r => set.add(r.fecha.slice(0, 10)));
  });
  return set;
}
function racha() {
  const set = diasActivos();
  const d = new Date();
  if (!set.has(fmtFecha(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(fmtFecha(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

  ];
  const r = reglas.find(([p]) => p.some(w => coincide(x, w)));
  let t = r ? r[1] : 'Contame un poco más: qué tipo de planta es, en qué etapa está y qué observás. Mientras tanto, un consejo: ' + TIPS[new Date().getDate() % TIPS.length];

function fotoHTML() {

function sparkPPFD(c) {
  const vals = c.condiciones.map(x => x.ppfd).filter(x => x != null).reverse();
  if (vals.length < 2) return '';
  const W = 300, H = 70, max = 1000;
  const pts = vals.map((v, i) => [i * (W / (vals.length - 1)), H - Math.min(v, max) / max * H]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del PPFD" style="display:block;margin-top:8px">
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--accent)"/>`).join('')}
  </svg><div class="muted num">PPFD registrado (del más viejo al más nuevo): ${vals.join(' → ')}</div>`;
}
function gaugeVPD(v) {
  const pos = Math.min(v / 2, 1) * 100; const a = 0.8 / 2 * 100; const b = 1.2 / 2 * 100;
  return `<div class="gauge"><div class="band" style="left:${a}%;width:${b - a}%"></div><div class="mark" style="left:${pos}%"></div></div>
    <div class="muted num">VPD ${v} kPa · zona orientativa 0,8 a 1,2 kPa</div>`;
}
function condicionesHTML(c) {
  const f = S.f; const u = c.condiciones[0];
  const pp = u ? evaluarPPFD(c.etapa, u.ppfd) : null;
  const al = u ? evaluarAltura(u.alturaCm) : null;
  const v = u ? vpd(u.temp, u.humedad) : null;
  return `<h3>Luz y ambiente</h3>
    <div class="card">
      <div class="muted">Cargá una medición cuando quieras; la app la compara con la etapa.</div>
      <input class="input" type="number" placeholder="Potencia de la lámpara (W)" data-bind="watts" value="${esc(f.watts || '')}">
      <input class="input" type="number" placeholder="Altura sobre la planta (cm)" data-bind="altura" value="${esc(f.altura || '')}">
      <input class="input" type="number" placeholder="Horas de luz por día" data-bind="horas" value="${esc(f.horas || '')}">
      <input class="input" type="number" placeholder="PPFD medido (µmol/m²/s)" data-bind="ppfd" value="${esc(f.ppfd || '')}">
      <input class="input" type="number" placeholder="Temperatura (°C)" data-bind="temp" value="${esc(f.temp || '')}">
      <input class="input" type="number" placeholder="Humedad relativa (%)" data-bind="humedad" value="${esc(f.humedad || '')}">
      <button class="btn" data-act="condAdd">Guardar medición</button>
    </div>
    ${u ? `<div class="card"><strong>Última medición</strong>
      ${pp ? `<p class="${pp.ok ? 'okmsg' : 'alert'}">${pp.m}</p>` : ''}
      ${al ? `<p class="${al.ok ? 'okmsg' : 'alert'}">${al.m}</p>` : ''}
      ${v != null ? gaugeVPD(v) : ''}
      ${sparkPPFD(c)}
    </div>` : ''}`;
}

const modulosPlan = () => visibles().filter(m => !m.pro || esPro());
const moduloAprobado = m => !!m && (progreso[m.id] || 0) >= APROBAR_MODULO;
function barajar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
/* Mezcla las opciones en cada aparición: la posición de la correcta no se puede memorizar ni adivinar */
function armarPregunta(q) {
  const todas = barajar([{ t: q.ok, c: true }, ...q.no.map(t => ({ t, c: false }))]);
  return { d: q.d, p: q.p, o: todas.map(x => x.t), r: todas.findIndex(x => x.c), e: q.e, mod: q.mod };
}
/* Test de módulo: una pregunta de cada dificultad, sacada del banco del módulo y distinta a la del intento anterior si es posible */
function armarTest(m) {
  const pool = [...m.quiz, ...m.banco].map(q => ({ ...q, mod: m.id }));
  const vistas = S.vistas[m.id] || [];
  const elegidas = [1, 2, 3].map(d => {
    const c = pool.filter(q => q.d === d);
    const nuevas = c.filter(q => !vistas.includes(q.p));
    const base = nuevas.length ? nuevas : c;
    return base[Math.floor(Math.random() * base.length)];
  });
  S.vistas[m.id] = elegidas.map(q => q.p);
  return elegidas.map(armarPregunta);
}

}

/* ---------- Exámenes ---------- */
const exDe = id => EXAMENES.find(e => e.id === id);
const modulosExamen = ex => visibles().filter(m => m.cat !== 'cannabis' && (!ex.cats || ex.cats.includes(m.cat)) && (!m.pro || esPro()));
const poolExamen = ex => modulosExamen(ex).flatMap(m => [...m.quiz, ...m.banco].map(q => ({ ...q, mod: m.id })));
const cantPreguntas = ex => Math.min(ex.n, poolExamen(ex).length);
const tiempoLimite = ex => cantPreguntas(ex); // minutos: uno por pregunta
const intentosHoy = id => { const r = examenes[id]; return r && r.dia === hoyStr() ? r.n : 0; };
const fmtTiempo = s => { s = Math.max(0, Math.ceil(s)); return p2(Math.floor(s / 60)) + ':' + p2(s % 60); };
const restoExamen = () => (S.ex && S.ex.fin ? Math.round((S.ex.fin - Date.now()) / 1000) : 0);

function examenDisponible(ex) {
  if (ex.pro && !esPro()) return { ok: false, pro: true, motivo: 'Disponible en el plan Pro' };
  const faltan = (ex.pre || []).filter(id => !(examenes[id] && examenes[id].aprobado));
  if (faltan.length) return { ok: false, motivo: 'Primero aprobá: ' + faltan.map(id => exDe(id).t).join(', ') };
  const sin = modulosExamen(ex).filter(m => !moduloAprobado(m));
  if (sin.length) return { ok: false, motivo: 'Aprobá antes el test de: ' + sin.map(m => m.t).join(', ') };
  if (intentosHoy(ex.id) >= INTENTOS_DIA) return { ok: false, agotado: true, motivo: `Ya hiciste ${INTENTOS_DIA} intentos hoy. Volvé mañana y repasá los módulos.` };
  return { ok: true, motivo: '' };
}

/* Sorteo estratificado: mezcla de dificultades (20 % básicas, 40 % intermedias, 40 % trampa) y reparto parejo entre módulos */
function sortearExamen(ex) {
  const vistas = new Set(S.vistasEx[ex.id] || []);
  const pool = barajar(poolExamen(ex)).sort((a, b) => (vistas.has(a.p) ? 1 : 0) - (vistas.has(b.p) ? 1 : 0));
  const n = Math.min(ex.n, pool.length);
  const objetivo = { 1: Math.max(1, Math.round(n * 0.2)), 3: Math.round(n * 0.4) };
  objetivo[2] = n - objetivo[1] - objetivo[3];
  const elegidas = []; const cuenta = {};
  [3, 2, 1].forEach(d => {
    const cand = pool.filter(q => q.d === d);
    for (let k = 0; k < objetivo[d] && cand.length; k++) {
      let mejor = 0;
      for (let j = 1; j < cand.length; j++) if ((cuenta[cand[j].mod] || 0) < (cuenta[cand[mejor].mod] || 0)) mejor = j;
      const q = cand.splice(mejor, 1)[0];
      cuenta[q.mod] = (cuenta[q.mod] || 0) + 1;
      elegidas.push(q);
    }
  });
  while (elegidas.length < n) { const q = pool.find(x => !elegidas.includes(x)); if (!q) break; elegidas.push(q); }
  return barajar(elegidas).map(armarPregunta);
}

function iniciarExamen(id) {
  const ex = exDe(id);
  if (!ex || S.ex || !examenDisponible(ex).ok) return false;
  const reg = examenes[id] || (examenes[id] = { mejor: 0, aprobado: false, pts: 0, hist: [], dia: '', n: 0 });
  if (reg.dia !== hoyStr()) { reg.dia = hoyStr(); reg.n = 0; }
  reg.n++;
  const preguntas = sortearExamen(ex);
  S.vistasEx[id] = preguntas.map(q => q.p);
  S.ex = { id, fase: 'curso', preguntas, resp: [], i: 0, sel: null, inicio: Date.now(), fin: Date.now() + tiempoLimite(ex) * 60000, confirmaSalir: false };
  marcarEstudio();
  return true;
}

/* Puntaje con penalización: acierto = +dificultad, error = −dificultad/3, "No lo sé" o sin responder = 0 */
function puntuarExamen(e) {
  let max = 0, neto = 0, ac = 0, er = 0, nc = 0; const mods = {};
  e.preguntas.forEach((q, i) => {
    max += q.d;
    const r = e.resp[i];
    const mm = mods[q.mod] || (mods[q.mod] = { ac: 0, n: 0 }); mm.n++;
    if (r == null || r < 0) nc++;
    else if (r === q.r) { neto += q.d; ac++; mm.ac++; }
    else { neto -= q.d / 3; er++; }
  });
  const pct = max ? Math.max(0, neto) / max : 0;
  return { pct, ac, er, nc, mods, aprobado: pct >= APROBAR_EXAMEN - 1e-9 };
}

function terminarExamen(porTiempo) {
  const e = S.ex; if (!e || e.fase !== 'curso') return;
  const ex = exDe(e.id); const res = puntuarExamen(e);
  const reg = examenes[e.id] || (examenes[e.id] = { mejor: 0, aprobado: false, pts: 0, hist: [], dia: hoyStr(), n: 1 });
  e.res = res; e.fase = 'resultado'; e.porTiempo = !!porTiempo; e.sel = null; e.todo = false; e.confirmaSalir = false;
  reg.hist = [{ f: ahora(), pct: +res.pct.toFixed(3), ok: res.aprobado }, ...(reg.hist || [])].slice(0, 10);
  if (res.pct > reg.mejor) reg.mejor = +res.pct.toFixed(3);
  e.pts = 0;
  if (res.aprobado && !reg.aprobado) { reg.aprobado = true; reg.fecha = hoyStr(); reg.pts = ex.pts || 0; e.pts = reg.pts; e.primeraVez = true; }
  marcarEstudio();
}

  const propio = cat ? pendientes.find(x => x.cat === cat) : null; // el primero de su forma de cultivar, esté o no desbloqueado
  const ex = EXAMENES.find(x => examenDisponible(x).ok && !(examenes[x.id] && examenes[x.id].aprobado));
  const tarjeta = (m, titulo, boton) => `<div class="card">
      <div class="muted">${titulo}</div>

      <div class="muted">${m.d}</div>

function iniciarQuiz(id) {
  const m = modDe(id);
  S.apr = { ...S.apr, vista: 'quiz', mod: id, lec: 0, q: 0, resp: null, aciertos: 0, puntos: 0, bonus: 0, gan: 0, pregs: armarTest(m) };

/* Con un examen en curso solo se aceptan las acciones del propio examen */
const ACTS_EXAMEN = ['exSel', 'exOk', 'exSalir', 'exSalirNo', 'exSalirOk'];

function act(a, v) {
  if (S.ex && S.ex.fase === 'curso') {
    if (restoExamen() <= 0) terminarExamen(true);
    else if (!ACTS_EXAMEN.includes(a)) return;
  }
  const c = S.cultivos.find(x => x.id === S.abierto);
  const ap = S.apr;
  switch (a) {
    case 'next': if (S.onb < 3) S.onb++; else S.onboarded = true; break;
    case 'tab': S.tab = v; S.abierto = null; S.verCannabis = false; break;
    case 'irCultivo': S.tab = 'cultivos'; S.abierto = null; S.creando = true; break;
    case 'tarea': toggleTarea(v); break;
    case 'toggleForm': S.creando = !S.creando; break;
    case 'setUb': S.f.ub = v; break;
    case 'setEt': S.f.et = v; break;
    case 'crear':
      if ((S.f.nombre || '').trim() && !limiteAlcanzado()) {
        S.cultivos.unshift({ id: Date.now() + '-' + Math.floor(Math.random() * 10000), nombre: S.f.nombre.trim(), tipo: (S.f.tipo || '').trim() || 'Sin especificar',
          ubicacion: S.f.ub || 'interior', etapa: S.f.et || 'Siembra', fecha: S.f.fecha || hoyStr(), bitacora: [], condiciones: [] });
        ledger.creados++;
        S.f.nombre = ''; S.f.tipo = ''; S.creando = false;
      }
      break;
    case 'abrir': S.abierto = v; S.f.nota = ''; break;
    case 'volver': S.abierto = null; break;
    case 'etapaCultivo': if (c) c.etapa = v; break;
    case 'quick': if (c) { addEntry(c, v, S.f.nota); S.f.nota = ''; } break;
    case 'condAdd':
      if (c) {
        const med = { fecha: ahora(), watts: num(S.f.watts), alturaCm: num(S.f.altura), horas: num(S.f.horas),
          ppfd: num(S.f.ppfd), temp: num(S.f.temp), humedad: num(S.f.humedad) };
        if ([med.watts, med.alturaCm, med.horas, med.ppfd, med.temp, med.humedad].some(x => x != null)) {
          c.condiciones.unshift(med);
          ledgerSuma('m');
          S.f.ppfd = ''; S.f.altura = '';
        }
      }
      break;
    case 'enviar': enviarPregunta(S.f.pregunta); break;
    case 'preg': enviarPregunta(v); break;

    /* Aprender: módulos */
    case 'aprSec': ap.sec = v === 'examenes' ? 'examenes' : 'modulos'; ap.vista = 'lista'; break;
    case 'aprCat': ap.cat = v; break;
    case 'aprLista': ap.vista = 'lista'; break;
    case 'aprGlos': ap.vista = 'glosario'; break;
    case 'aprMod': { if (moduloDisponible(modDe(v)).ok) { ap.vista = 'modulo'; ap.mod = v; ap.lec = 0; ap.sec = 'modulos'; } break; }
    case 'lecSig': {
      const m = modDe(ap.mod);
      if (ap.lec < m.lec.length - 1) ap.lec++; else iniciarQuiz(ap.mod);
      break;
    }
    case 'resp': {
      if (ap.resp === null && ap.pregs) {
        const preg = ap.pregs[ap.q];
        ap.resp = +v;
        if (ap.resp === preg.r) { ap.aciertos++; ap.puntos += preg.d * 10; }
      }
      break;
    }
    case 'pregSig': {
      if (ap.resp === null || !ap.pregs) break;
      const m = modDe(ap.mod); const n = ap.pregs.length;
      if (ap.q < n - 1) { ap.q++; ap.resp = null; }
      else {
        const prev = progreso[m.id];
        if (prev == null || ap.aciertos > prev) progreso[m.id] = ap.aciertos;
        ap.bonus = ap.aciertos === n ? BONUS_PERFECTO : 0;
        const antes = progresoPts[m.id] || 0; const nuevo = ap.puntos + ap.bonus;
        ap.gan = Math.max(0, nuevo - antes);
        if (nuevo > antes) progresoPts[m.id] = nuevo;
        marcarEstudio();
        ap.vista = 'resultado';
      }
      break;
    }
    case 'repetir': iniciarQuiz(ap.mod); break;

    /* Aprender: exámenes */
    case 'exInfo': if (exDe(v)) { ap.vista = 'exinfo'; ap.exId = v; ap.sec = 'examenes'; } break;
    case 'irExamen':
      if (exDe(v)) { if (S.ex && S.ex.fase === 'resultado') S.ex = null; S.tab = 'aprender'; ap.sec = 'examenes'; ap.vista = 'exinfo'; ap.exId = v; }
      break;
    case 'exStart': if (iniciarExamen(ap.exId)) ap.vista = 'lista'; break;
    case 'exSel': if (S.ex && S.ex.fase === 'curso' && !S.ex.confirmaSalir) S.ex.sel = +v; break;
    case 'exOk': {
      const e = S.ex;
      if (!e || e.fase !== 'curso' || e.sel == null || e.confirmaSalir) break;
      e.resp[e.i] = e.sel; e.sel = null;
      if (e.i < e.preguntas.length - 1) e.i++; else terminarExamen(false);
      break;
    }
    case 'exSalir': if (S.ex && S.ex.fase === 'curso') S.ex.confirmaSalir = true; break;
    case 'exSalirNo': if (S.ex) S.ex.confirmaSalir = false; break;
    case 'exSalirOk': if (S.ex && S.ex.fase === 'curso') { S.ex = null; ap.vista = 'lista'; ap.sec = 'examenes'; } break;
    case 'exLista': if (S.ex && S.ex.fase === 'resultado') S.ex = null; ap.vista = 'lista'; ap.sec = 'examenes'; break;
    case 'exTodo': if (S.ex && S.ex.fase === 'resultado') S.ex.todo = !S.ex.todo; break;
    case 'exRepasar': {
      const m = modDe(v);
      if (m && moduloDisponible(m).ok) { if (S.ex && S.ex.fase === 'resultado') S.ex = null; ap.vista = 'modulo'; ap.mod = v; ap.lec = 0; ap.sec = 'modulos'; }
      break;
    }
    case 'constancia': if (examenFinalAprobado()) { if (S.ex && S.ex.fase === 'resultado') S.ex = null; ap.vista = 'constancia'; ap.sec = 'examenes'; } break;
    case 'copiarConst': {
      if (!examenFinalAprobado()) break;
      const txt = constanciaTexto();
      const ta = document.getElementById('cons'); if (ta) ta.value = txt;
      try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
      break;
    }

    case 'cannAbrir': if (CANNABIS_HABILITADO) S.verCannabis = true; break;
    case 'cannVolver': S.verCannabis = false; break;
    case 'cannEdad': S.edadOk = true; break;
    case 'cannTab': S.cannTab = v; break;
    case 'cannEt': S.cannEt = v; break;
    case 'perfil': S.perfil = v; escribir('bv_perfil', v); break;
    case 'irModulo': if (moduloDisponible(modDe(v)).ok) { S.tab = 'aprender'; ap.vista = 'modulo'; ap.mod = v; ap.lec = 0; ap.sec = 'modulos'; } break;
    case 'trial': { const f = new Date(); f.setDate(f.getDate() + 14); trial = { usado: true, fin: fmtFecha(f) }; S.plan = 'pro'; break; }
    case 'verPriv': S.verPriv = !S.verPriv; break;
    case 'exportar': S.exportar = S.exportar === v ? null : v; break;
    case 'copiar': { const ta = document.getElementById('exp'); if (ta) { ta.select(); try { navigator.clipboard.writeText(ta.value).catch(() => {}); } catch (e) {} } break; }
    case 'setPlan': S.plan = v.startsWith('pro') ? 'pro' : v; S.ciclo = v === 'pro-anual' ? 'anual' : 'mensual'; trial.fin = null; break;
    case 'plantilla': { const p = PLANTILLAS[+v]; if (p) { S.f.nombre = p[0]; S.f.tipo = p[1]; S.f.ub = p[2]; S.f.et = 'Siembra'; S.f.fecha = hoyStr(); S.creando = true; } break; }
    case 'filtroCult': S.filtroCult = v; break;
    case 'filtroBit': S.filtroBit = v; break;
    case 'confEliminar': S.confCult = S.confCult === v ? null : v; break;
    case 'eliminarOK': S.cultivos = S.cultivos.filter(x => x.id !== v); S.abierto = null; S.confCult = null; break;
    case 'estrella': S.f.estrellas = +v; break;
    case 'copiarOp': {
      const txt = textoOpinion();
      const ta = document.getElementById('opn'); if (ta) ta.value = txt;
      try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
      break;
    }
    case 'borrar': S.confirmarBorrado = true; break;
    case 'borrarNo': S.confirmarBorrado = false; break;
    case 'borrarOK':
      S.cultivos = []; S.plan = 'gratis'; S.confirmarBorrado = false; S.abierto = null; S.fotos = [];
      progreso = {}; progresoPts = {}; tareasPorDia = {};
      ledger = { dias: {}, creados: 0 }; estudio = {}; examenes = {}; S.ex = null; S.vistas = {}; S.vistasEx = {};
      S.apr = { vista: 'lista', mod: null, lec: 0, q: 0, resp: null, aciertos: 0, cat: 'todas', sec: 'modulos' };
      break;
  }
}

document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.bind;
  if (!k) return;
  S.f[k] = e.target.value;
  if (k === 'nombreConst' && examenFinalAprobado()) { const t = document.getElementById('cons'); if (t) t.value = constanciaTexto(); }
});

document.addEventListener('change', e => {
  const tipo = e.target.dataset && e.target.dataset.foto;
  if (tipo === undefined) return;
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    if (tipo === 'cultivo') {
      const c = S.cultivos.find(x => x.id === S.abierto);
      if (c) { c.fotos = c.fotos || []; c.fotos.unshift({ src: r.result, fecha: ahora() }); }
    } else {
      S.fotos.unshift({ src: r.result, fecha: ahora(), analisis: 'Análisis de ejemplo: en la versión conectada, el guía revisa el color de las hojas, manchas, plagas visibles y la estructura de la planta, y te propone una acción concreta. Acá no se analiza la imagen real.' });
    }
    draw();
  };
  r.readAsDataURL(f);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  act(el.dataset.act, el.dataset.v);
  guardar();
  draw();
});

draw();
const _tickEx = setInterval(exTick, 1000);
if (_tickEx && _tickEx.unref) _tickEx.unref(); // solo para las pruebas en Node
</script>
