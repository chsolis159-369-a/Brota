# Crear un cultivo, registrar y medir: puntos con topes y evaluación de la luz.
# Los textos se buscan con patrones (.*): Maestro interpreta el texto como expresión regular.
appId: com.brota.app
---
- runFlow: comun/onboarding.yaml
- tapOn: "Cultivos"
- assertVisible: "Mis cultivos"
- runFlow:
    file: comun/crear-cultivo.yaml
    env:
      NOMBRE: "Lechuga Maestro"
- tapOn:
    id: "cultivo-Lechuga Maestro"
- assertVisible: "Hacé tu primer registro para empezar la bitácora"
- tapOn:
    id: "registro-Riego"
- scrollUntilVisible:
    element:
      text: "Cada registro suma 2 pts .hoy 1 de 5.. Cada medición de luz suma 4 pts .hoy 0 de 2.."
- scrollUntilVisible:
    element:
      id: "medicion-ppfd"
- tapOn:
    id: "medicion-ppfd"
- inputText: "400"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "guardar-medicion"
- tapOn:
    id: "guardar-medicion"
- scrollUntilVisible:
    element:
      text: "Demasiada luz para siembra .recomendado 150–300.. Alejá la lámpara para evitar estrés lumínico."
- scrollUntilVisible:
    element:
      text: "Registro rápido: riego"
- scrollUntilVisible:
    element:
      id: "eliminar-cultivo"
- tapOn:
    id: "eliminar-cultivo"
- scrollUntilVisible:
    element:
      id: "confirmar-eliminar"
- tapOn:
    id: "confirmar-eliminar"
- assertVisible: "Mis cultivos"
- assertNotVisible: "Lechuga Maestro"
# Los puntos del registro (2) y la medición (4) no se pierden al borrar el cultivo.
- tapOn: "Hoy"
- assertVisible: "6"
