# Agente: pregunta rápida y negativa ante dosis, consumo o venta.
# Con servidor responde la IA (texto variable) y sin servidor, las reglas (D-25, D-27): el flujo verifica
# lo que es igual en los dos modos. La negativa siempre la resuelve la app, sin llamar a la IA.
appId: com.brota.app
---
- runFlow: comun/onboarding.yaml
- tapOn: "Agente"
- scrollUntilVisible:
    element:
      id: "pregunta-0"
- tapOn:
    id: "pregunta-0"
- extendedWaitUntil:
    notVisible: "Pensando…"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "campo-pregunta"
- tapOn:
    id: "campo-pregunta"
- inputText: "que dosis uso"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "enviar-pregunta"
- tapOn:
    id: "enviar-pregunta"
- scrollUntilVisible:
    element:
      text: "Solo puedo orientarte sobre cultivo. No doy información sobre dosis, consumo ni venta."
