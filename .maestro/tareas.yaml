# Tareas de hoy: marcar suma puntos con el tope diario visible; desmarcar los quita.
# (La cantidad de tareas depende del pronóstico real: con lluvia mañana aparece el drenaje.)
appId: com.brota.app
---
- runFlow: comun/onboarding.yaml
- scrollUntilVisible:
    element:
      id: "tarea-riego-ejemplo-1"
- tapOn:
    id: "tarea-riego-ejemplo-1"
- scrollUntilVisible:
    element:
      text: "Tareas de hoy: 5 de 40 pts posibles por día.*"
- scrollUntilVisible:
    element:
      id: "tarea-med-ejemplo-1"
    direction: UP
- tapOn:
    id: "tarea-med-ejemplo-1"
- scrollUntilVisible:
    element:
      text: "Tareas de hoy: 15 de 40 pts posibles por día.*"
- scrollUntilVisible:
    element:
      id: "tarea-med-ejemplo-1"
    direction: UP
- tapOn:
    id: "tarea-med-ejemplo-1"
- scrollUntilVisible:
    element:
      text: "Tareas de hoy: 5 de 40 pts posibles por día.*"
