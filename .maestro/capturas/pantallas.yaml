# Capturas de las pantallas principales para revisar el diseño (D-29, D-32). No es una prueba: el workflow de
# Android lo corre aparte en modo claro, en oscuro y con la letra al máximo (MODO=claro, oscuro o grande) y guarda las
# imágenes en el artefacto "capturas".
appId: com.brota.app
---
- runFlow: ../comun/onboarding.yaml
- takeScreenshot: capturas/${MODO}-1-hoy
- scroll
- takeScreenshot: capturas/${MODO}-2-hoy-tareas
- tapOn: "Cultivos"
- takeScreenshot: capturas/${MODO}-3-cultivos
- tapOn:
    id: "cultivo-Albahaca 1"
- takeScreenshot: capturas/${MODO}-4-cultivo
- tapOn: "Agente"
- takeScreenshot: capturas/${MODO}-5-agente
- scroll
- takeScreenshot: capturas/${MODO}-6-agente-chat
- tapOn: "Aprender"
- takeScreenshot: capturas/${MODO}-7-aprender
- scroll
- takeScreenshot: capturas/${MODO}-8-aprender-modulos
- tapOn: "Plan"
- takeScreenshot: capturas/${MODO}-9-plan
- tapOn:
    id: "abrir-configuracion"
- takeScreenshot: capturas/${MODO}-10-configuracion
- scroll
- takeScreenshot: capturas/${MODO}-11-configuracion-perfil
