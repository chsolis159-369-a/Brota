# Subflujo: abre la app desde cero y completa el onboarding eligiendo Hidroponía.
appId: com.brota.app
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "Bienvenido a BROTA"
- tapOn: "Siguiente"
- assertVisible: "Tareas, registros y logros"
- tapOn: "Siguiente"
- assertVisible: "Aprendizaje y un guía"
- tapOn: "Siguiente"
- assertVisible: "¿Qué cultivás?"
- tapOn:
    id: "perfil-hidro"
- tapOn: "Empezar"
# Hoy pide la ubicación para el clima. El diálogo aparece unos segundos después: se lo espera y se
# rechaza; el clima usa la ubicación por defecto (D-19, D-20).
- extendedWaitUntil:
    visible: "Don.t allow|No permitir"
    timeout: 10000
    optional: true
- tapOn:
    text: "Don.t allow|No permitir"
    optional: true
- assertVisible: "Tareas de hoy"
