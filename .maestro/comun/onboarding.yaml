# Subflujo: abre la app desde cero y completa el onboarding eligiendo Hidroponía.
appId: com.brota.app
---
# La ubicación se concede de entrada: si no, Android muestra el diálogo en un momento variable y
# tapa la pantalla (carrera de tiempos). El clima usa la ubicación del emulador.
- launchApp:
    clearState: true
    permissions:
      all: deny
      location: allow
- assertVisible: "Bienvenido a BROTA"
- tapOn: "Siguiente"
- assertVisible: "Tareas, registros y logros"
- tapOn: "Siguiente"
- assertVisible: "Aprendizaje y un guía"
- tapOn: "Siguiente"
- assertVisible: "¿Qué cultivás?"
- tapOn:
    id: "perfil-hidro"
- tapOn: "Empezar"
# Red de seguridad: si igual aparece el diálogo de ubicación, se rechaza (D-19).
- tapOn:
    text: "Don.t allow|No permitir"
    optional: true
- assertVisible: "Tareas de hoy"
