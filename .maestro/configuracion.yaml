# Configuración (D-35 y D-36): idioma, modo oscuro, letra más grande y vuelta a las pestañas. Al final deja todo
# como estaba.
appId: com.brota.app
---
- runFlow: comun/onboarding.yaml
- tapOn:
    id: "abrir-configuracion"
- assertVisible: "Configuración"
- assertVisible: "Idioma"
- tapOn:
    id: "idioma-en"
- assertVisible: "Settings"
- assertVisible: "Lessons, questions and the glossary are in Spanish for now."
- tapOn:
    id: "idioma-zh-CN"
- assertVisible: "设置"
- tapOn:
    id: "idioma-es-AR"
- assertVisible: "Configuración"
- tapOn:
    id: "tema-oscuro"
- tapOn:
    id: "letra-muyGrande"
- assertVisible: "Así se ve el texto de las lecciones y del guía."
- tapOn:
    id: "letra-normal"
- tapOn:
    id: "tema-sistema"
- scrollUntilVisible:
    element:
      id: "ver-terminos"
- tapOn:
    id: "ver-terminos"
- scrollUntilVisible:
    element:
      text: "Términos y condiciones"
    direction: UP
- scrollUntilVisible:
    element:
      id: "volver-configuracion"
    direction: UP
- tapOn:
    id: "volver-configuracion"
- assertVisible: "Hoy"
